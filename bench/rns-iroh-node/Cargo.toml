[package]
name = "rns-iroh-node"
version = "0.1.0"
edition = "2024"
publish = false
description = "RNS (leviculum) over iroh/QUIC with a native byte-channel adapter: roles E (exit), A (transport), C (client)"

[lib]
name = "rns_iroh_node"
path = "src/lib.rs"

[[bin]]
name = "rns-iroh-node"
path = "src/main.rs"

[dependencies]
# Pinned revision studied in research notes (Codeberg master of 2026-10-08, AGPL-3.0-or-later).
leviculum-std = { git = "https://codeberg.org/Lew_Palm/Leviculum", rev = "cb814c8513fb59d991c96106f1dcdd5d070cb423" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
libc = "0.2"
bytes = "1"
# same version iroh 1.3.0 depends on; only for congestion::Bbr3Config
noq-proto = "=1.3.0"
hmac = "0.12"
base64 = "0.22"
rand_core = { version = "0.6", features = ["std", "getrandom"] }
# только для диагностики (счётчики sendmsg/recvmmsg), нужен локальный patch noq-udp: bench/android/build.sh с RAWG_UDPSTATS=1
noq-udp = { version = "=1.3.0", optional = true }

[features]
udp-stats = ["dep:noq-udp"]
