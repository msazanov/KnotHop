[package]
name = "rns-iroh-node"
version = "0.1.0"
edition = "2024"
publish = false
description = "RNS (leviculum) over iroh/QUIC with a native byte-channel adapter: roles E (exit), A (transport), C (client)"

[lib]
name = "rns_iroh_node"
path = "src/lib.rs"

[[bin]]
name = "rns-iroh-node"
path = "src/main.rs"

[dependencies]
# All Leviculum crates MUST stay on the same public upstream revision (Codeberg master, AGPL-3.0-or-later;
# 77c4ff13 is the merge-base of the KnotHop fork, deploy/leviculum.ref). The fork commit itself is not on
# Codeberg: real builds substitute the local fork checkout for std, lxmf and lnpnd through Cargo [patch]
# (bench/fork-patch.sh, used by bench/cargo_fork.sh and the build scripts), so leviculum-core is a single
# package. Do not point one of them at a different rev or source.
leviculum-std = { git = "https://codeberg.org/Lew_Palm/Leviculum", rev = "77c4ff13f59116adaf0190d455b83c286c135066" }
leviculum-lxmf = { git = "https://codeberg.org/Lew_Palm/Leviculum", rev = "77c4ff13f59116adaf0190d455b83c286c135066", default-features = false, features = ["pow"] }
# Штатный встраиваемый PN engine того же форка; AGPL-3.0-or-later, без BLE/serial.
lnpnd = { git = "https://codeberg.org/Lew_Palm/Leviculum", rev = "77c4ff13f59116adaf0190d455b83c286c135066", default-features = false }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
libc = "0.2"
bytes = "1"
# same version iroh 1.3.0 depends on; only for congestion::Bbr3Config
noq-proto = "=1.3.0"
hmac = "0.12"
base64 = "0.22"
rand_core = { version = "0.6", features = ["std", "getrandom"] }
# только для диагностики (счётчики sendmsg/recvmmsg), нужен локальный patch noq-udp: bench/android/build.sh с KNOTHOP_UDPSTATS=1
noq-udp = { version = "=1.3.0", optional = true }

[features]
udp-stats = ["dep:noq-udp"]
# Лабораторный обход enforce роли `e` (бинарник rns-iroh-node для стендов замеров l3_cell/laptop/lev_cell). Не включать в knothopd и APK.
lab-exit-no-enforce = []
