events {}
http { server { listen 443 ssl; http2 on; server_name cover.lab;
 ssl_certificate /c/c.pem; ssl_certificate_key /c/k.pem; ssl_protocols TLSv1.3; ssl_ecdh_curve X25519MLKEM768:X25519;
 location / { return 200 "COVER-SITE-OK\n"; add_header Content-Type text/plain; }
 # крупный ресурс для эталона «скачивание» (файл /c/big создаёт up.sh/ручной запуск: 96 КиБ случайных байт)
 location = /big { root /c; default_type text/plain; } } }
