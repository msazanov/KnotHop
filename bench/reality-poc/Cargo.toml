[package]
name = "reality-poc"
version = "0.0.1"
edition = "2021"
publish = false
description = "PoC: iroh custom transport over a TCP stream (carried by REALITY). Lab only; not part of knothopd/APK."

[workspace]

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = "=1.3.0"
n0-watcher = "1"
noq-udp = "=1.3.0"
noq-proto = "=1.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "net", "signal"] }
anyhow = "1"
bytes = "1"

# Те же локальные правки, что у knothopd (bench/vendor/*/PATCH.md): custom-path MTU cap и др.
[patch.crates-io]
iroh = { path = "../vendor/iroh" }
noq-proto = { path = "../vendor/noq-proto" }

[profile.release]
opt-level = 3
debug = 0
lto = "off"
codegen-units = 16
